[project]
name = "leadsgen"
version = "0.2.0"
description = "Public business contact discovery and mail-system handoff"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141.1", "uvicorn>=0.53.0", "urllib3>=2.8.0", "certifi>=2026.6.17", "beautifulsoup4>=4.14", "dnspython>=2.8", "tldextract>=5.3", "httpx>=0.28"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/leadsgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
